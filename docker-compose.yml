volumes:
  server-data:
    driver: local

services:
  telegram-bot-api:
    image: ghcr.io/bots-house/docker-telegram-bot-api:latest
    container_name: telegram-bot-api
    hostname: localhost
    command: "--dir=/var/lib/telegram-bot-api"
    volumes:
      - server-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
